name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      # Catches use of internal or removed API against the IDE builds the plugin claims to support.
      # It runs the verifier against a downloaded IDE, so it is the slowest step by far - worth it,
      # since a compatibility break is invisible until someone installs the result.
      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
